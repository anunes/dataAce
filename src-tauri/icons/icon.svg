<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#1e293b"/>

  <!-- Bottom cylinder body -->
  <rect x="116" y="300" width="280" height="60" fill="#0f172a"/>
  <line x1="116" y1="300" x2="116" y2="360" stroke="#3b82f6" stroke-width="4"/>
  <line x1="396" y1="300" x2="396" y2="360" stroke="#3b82f6" stroke-width="4"/>
  <ellipse cx="256" cy="360" rx="140" ry="36" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>
  <ellipse cx="256" cy="300" rx="140" ry="36" fill="#1e3a5f" stroke="#3b82f6" stroke-width="4"/>

  <!-- Middle cylinder body -->
  <rect x="116" y="220" width="280" height="80" fill="#0f172a"/>
  <line x1="116" y1="220" x2="116" y2="300" stroke="#3b82f6" stroke-width="4"/>
  <line x1="396" y1="220" x2="396" y2="300" stroke="#3b82f6" stroke-width="4"/>
  <ellipse cx="256" cy="220" rx="140" ry="36" fill="#1e3a8a" stroke="#3b82f6" stroke-width="4"/>

  <!-- Top cylinder body -->
  <rect x="116" y="152" width="280" height="68" fill="#0f172a"/>
  <line x1="116" y1="152" x2="116" y2="220" stroke="#3b82f6" stroke-width="4"/>
  <line x1="396" y1="152" x2="396" y2="220" stroke="#3b82f6" stroke-width="4"/>
  <ellipse cx="256" cy="152" rx="140" ry="36" fill="#2563eb" stroke="#60a5fa" stroke-width="4"/>

  <!-- Shine on top ellipse -->
  <ellipse cx="210" cy="144" rx="60" ry="13" fill="white" opacity="0.18"/>

  <!-- Letter A -->
  <text x="256" y="310" font-family="Arial Black, Arial, sans-serif" font-size="148" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" opacity="0.92">A</text>
</svg>
