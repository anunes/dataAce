[package]
name = "dataace"
version = "1.0.0"
edition = "2021"

[lib]
name = "dataace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
oracle-support = ["dep:oracle"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
mysql_async = "0.34"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tokio-postgres = "0.7"
async-trait = "0.1"
oracle = { version = "0.6", optional = true }
tiberius = { version = "0.13", features = ["chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
